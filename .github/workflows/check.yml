name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    # Linux 文件系统区分大小写，可发现 Windows 上无法暴露的路径大小写问题；版本固定原因同 install.yml
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pip install maafw（动态取 PyPI 最新 stable 版本固定安装，与发布包保持一致）
      - name: Resolve maafw version from PyPI
        id: maa_version
        shell: bash
        run: |
          curl -sf "https://pypi.org/pypi/maafw/json" \
            | python -c "import json,sys; print('maafw_version=' + json.load(sys.stdin)['info']['version'])" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maafw==${{ steps.maa_version.outputs.maafw_version }}"

      # 按 interface.json 声明的全部资源组合加载（官服、插件版汉化、DMM、DMM插件汉化版）
      - name: Check Resource
        run: |
          python ./tools/ci/check_resource.py --interface ./assets/interface.json

      # 培育决策特征测试（需要 maafw）；行为有意变更时同步修改断言
      - name: Produce Characterization Tests
        env:
          PYTHONUTF8: "1"
        run: |
          python ./research/produce/test_produce_decisions.py

  interface:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 静态检查任务入口、pipeline_override 目标节点、Custom 名称、模板与路径大小写，无需安装 maafw
      - name: Check Interface References
        run: |
          python ./tools/ci/check_interface.py
